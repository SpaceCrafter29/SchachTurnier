<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Online-Quoridor</title>
<style>
:root{
  --bg:#eaeaec; --panel:#ffffff; --panel2:#eeeeef; --line:#dcdcdd;
  --txt:#26262a; --muted:#7a7a80; --accent:#4a4a52;
  --a-color:#33333a; --b-color:#b6b6bb;
  --cell-l:#f4f4f5; --cell-d:#dcdcdf; --wall:#3c3c42;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent);font-weight:600}
header{background:var(--accent);padding:18px 14px;text-align:center}
header h1{margin:0;font-size:21px;letter-spacing:.3px;color:#fff}
main{padding:12px;max-width:460px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.note{font-size:11.5px;color:var(--muted);text-align:center;margin-top:2px}

.room-status{font-size:14px;font-weight:700;margin-bottom:10px;padding:10px 12px;border-radius:10px;background:var(--panel2);text-align:center}
.room-status.mine{background:var(--txt);color:#fff}
.room-status.wait{background:#dcdce0}
.share-row{display:flex;gap:6px}
.share-row input{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:8px 10px;font-size:12px}
.share-row button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:8px 12px;font-weight:700;font-size:12px;cursor:pointer;white-space:nowrap}

.board-wrap{width:100%;aspect-ratio:1;position:relative;border-radius:12px;overflow:hidden;background:var(--panel2);box-shadow:inset 0 0 0 1px var(--line)}
.qboard{width:100%;height:100%;display:grid;user-select:none}
.qcell{position:relative;border-radius:4px}
.qcell.l{background:var(--cell-l)}
.qcell.d{background:var(--cell-d)}
.qcell.goal-a{box-shadow:inset 0 0 0 2px rgba(51,51,58,.3)}
.qcell.goal-b{box-shadow:inset 0 0 0 2px rgba(182,182,187,.9)}
.qwall{background:var(--wall);border-radius:4px;z-index:1;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.qwall.preview{opacity:.55}
.qwall.preview.bad{background:#c66}
.qmove{background:rgba(38,38,42,.15);border-radius:6px;width:100%;height:100%;z-index:1}
.qmove:active{background:rgba(38,38,42,.32)}
.qpawn{align-self:center;justify-self:center;width:60%;height:60%;border-radius:50%;pointer-events:none;box-shadow:0 2px 3px rgba(0,0,0,.3)}
.qpawn.a{background:var(--a-color)}
.qpawn.b{background:var(--b-color);box-shadow:0 2px 3px rgba(0,0,0,.25),0 0 0 1.5px rgba(0,0,0,.2) inset}
.qpawn.movable{box-shadow:0 0 0 3px rgba(38,38,42,.35),0 2px 3px rgba(0,0,0,.3)}

.legend{display:flex;gap:16px;justify-content:center;margin-top:10px;font-size:12px;color:var(--muted)}
.legend b{color:var(--txt)}
.legend .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.legend .dot.a{background:var(--a-color)}
.legend .dot.b{background:var(--b-color);box-shadow:0 0 0 1px rgba(0,0,0,.2) inset}

.place-row{display:flex;gap:6px;margin-top:10px}
.place-row button{flex:1;border:0;border-radius:9px;padding:12px 4px;font-weight:700;font-size:15px;cursor:pointer;min-height:44px}
.place-row .nudge{background:var(--panel2);color:var(--txt);border:1px solid var(--line)}
.place-row .ok{background:var(--accent);color:#fff}
.place-row .ok:disabled{opacity:.4;cursor:not-allowed}
.place-row .cancel{background:none;color:var(--muted);border:1px solid var(--line);flex:0 0 auto;padding:12px 14px}

.btnrow{display:flex;gap:8px;margin-top:10px}
button.btn{background:var(--accent);color:#fff;border:0;border-radius:9px;padding:11px 12px;font-weight:700;cursor:pointer;font-size:13px;flex:1}
button.btn.sec{background:var(--panel2);color:var(--txt);border:1px solid var(--line)}
button.btn:disabled{opacity:.4;cursor:not-allowed}

footer{text-align:center;color:var(--muted);font-size:11px;padding:20px 12px 40px}
.err-box{padding:14px;background:#f3e3e3;color:#7a2f2f;border-radius:8px;font-size:13px;line-height:1.5;text-align:center}
</style>
</head>
<body>

<header><h1>🧱 Online-Quoridor</h1></header>

<main id="main-wrap">
  <div class="card" id="room-card">
    <div class="room-status" id="room-status">Verbinde…</div>
    <div class="share-row">
      <input type="text" id="share-link" readonly>
      <button id="btn-copy">📋 Kopieren</button>
    </div>
  </div>

  <div class="card">
    <div class="board-wrap"><div class="qboard" id="board"></div></div>
    <div class="legend">
      <span><span class="dot a"></span>Wände <b id="walls-a">10</b></span>
      <span><span class="dot b"></span>Wände <b id="walls-b">10</b></span>
    </div>

    <div class="place-row" id="place-row" style="display:none">
      <button class="nudge" id="btn-left">⬅️</button>
      <button class="nudge" id="btn-rotate">🔄</button>
      <button class="nudge" id="btn-right">➡️</button>
      <button class="ok" id="btn-confirm">✔️</button>
      <button class="cancel" id="btn-cancel">✕</button>
    </div>
    <div class="note" id="place-hint" style="display:none">Wand verschieben &amp; drehen, dann bestätigen</div>

    <div class="btnrow" id="normal-row">
      <button class="btn sec" id="btn-undo">↩️ Zurück</button>
      <button class="btn sec" id="btn-new">🆕 Neu</button>
    </div>
  </div>

  <div class="note">Tippe deine Kugel zum Ziehen, sonst irgendwo aufs Feld für eine Wand.</div>
</main>

<footer><a href="./index.html">← Zur Hauptseite</a> · <a href="./quoridor.html">🆕 Neuer Raum</a></footer>

<script type="module">
"use strict";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getFirestore, doc, setDoc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig = {
  projectId: "strategic-bus-gtgzl",
  appId: "1:223160037293:web:05722321bf1f676a477b24",
  apiKey: "AIzaSyAnnacfE_oBHBFAVytJfB2jjYyg883PpZ0",
  authDomain: "strategic-bus-gtgzl.firebaseapp.com",
  storageBucket: "strategic-bus-gtgzl.firebasestorage.app",
  messagingSenderId: "223160037293"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app, "ai-studio-ae9706c1-9a01-400b-b585-6db71a52287f");

/* ---------- Spielregeln (reines JS, unabhängig von der Firebase-Anbindung) ---------- */
function initialState(){
  return {
    pawns: { a: {x:4,y:0}, b: {x:4,y:8} },
    wallsLeft: { a: 10, b: 10 },
    walls: [], /* {x,y,orient:'h'|'v'} */
    turn: 'a',
    winner: null
  };
}
function wallsGrid(walls){
  const W = Array.from({length:8}, ()=>Array(8).fill(null));
  for(const w of walls) W[w.x][w.y] = w.orient;
  return W;
}
function edgeBlocked(W, x1,y1,x2,y2){
  if(x1===x2){
    const y = Math.min(y1,y2), x = x1;
    if(x-1>=0 && W[x-1][y]==='h') return true;
    if(x<=7 && W[x][y]==='h') return true;
    return false;
  } else {
    const x = Math.min(x1,x2), y = y1;
    if(y-1>=0 && W[x][y-1]==='v') return true;
    if(y<=7 && W[x][y]==='v') return true;
    return false;
  }
}
function legalMoves(state){
  const me = state.turn, opp = me==='a' ? 'b' : 'a';
  const p = state.pawns[me], o = state.pawns[opp];
  const W = wallsGrid(state.walls);
  const dirs = [[0,-1],[0,1],[-1,0],[1,0]];
  const moves = [];
  for(const [dx,dy] of dirs){
    const nx=p.x+dx, ny=p.y+dy;
    if(nx<0||nx>8||ny<0||ny>8) continue;
    if(edgeBlocked(W,p.x,p.y,nx,ny)) continue;
    if(nx===o.x && ny===o.y){
      const jx=nx+dx, jy=ny+dy;
      if(jx>=0&&jx<=8&&jy>=0&&jy<=8 && !edgeBlocked(W,nx,ny,jx,jy)){
        moves.push({x:jx,y:jy});
      } else {
        const perp = dx!==0 ? [[0,-1],[0,1]] : [[-1,0],[1,0]];
        for(const [pdx,pdy] of perp){
          const dxp=nx+pdx, dyp=ny+pdy;
          if(dxp<0||dxp>8||dyp<0||dyp>8) continue;
          if(edgeBlocked(W,nx,ny,dxp,dyp)) continue;
          moves.push({x:dxp,y:dyp});
        }
      }
    } else {
      moves.push({x:nx,y:ny});
    }
  }
  return moves;
}
function hasPath(W, start, goalRow){
  const seen = new Set([start.x+','+start.y]);
  const stack = [start];
  while(stack.length){
    const cur = stack.pop();
    if(cur.y===goalRow) return true;
    for(const [dx,dy] of [[0,-1],[0,1],[-1,0],[1,0]]){
      const nx=cur.x+dx, ny=cur.y+dy;
      if(nx<0||nx>8||ny<0||ny>8) continue;
      if(edgeBlocked(W,cur.x,cur.y,nx,ny)) continue;
      const key=nx+','+ny;
      if(!seen.has(key)){ seen.add(key); stack.push({x:nx,y:ny}); }
    }
  }
  return false;
}
function canPlaceWall(state, x, y, orient){
  if(state.winner) return false;
  if(state.wallsLeft[state.turn]<=0) return false;
  if(x<0||x>7||y<0||y>7) return false;
  const W = wallsGrid(state.walls);
  if(W[x][y]) return false;
  if(orient==='h'){
    if(x-1>=0 && W[x-1][y]==='h') return false;
    if(x+1<=7 && W[x+1][y]==='h') return false;
  } else {
    if(y-1>=0 && W[x][y-1]==='v') return false;
    if(y+1<=7 && W[x][y+1]==='v') return false;
  }
  const W2 = W.map(col=>col.slice());
  W2[x][y] = orient;
  if(!hasPath(W2, state.pawns.a, 8)) return false;
  if(!hasPath(W2, state.pawns.b, 0)) return false;
  return true;
}
function applyAction(state, action){
  if(action.type==='move'){
    state.pawns[state.turn] = {x:action.x, y:action.y};
  } else {
    state.walls.push({x:action.x, y:action.y, orient:action.orient});
    state.wallsLeft[state.turn]--;
  }
  if(state.pawns.a.y===8) state.winner = 'a';
  else if(state.pawns.b.y===0) state.winner = 'b';
  else state.turn = state.turn==='a' ? 'b' : 'a';
  return state;
}
function replay(actions){
  let s = initialState();
  for(const a of actions) s = applyAction(s, a);
  return s;
}

/* ---------- Raum-Setup (identisches Muster wie training.html) ---------- */
function genRoomId(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = '';
  for(let i=0;i<6;i++) s += chars[Math.floor(Math.random()*chars.length)];
  return s;
}
function getClientId(){
  let id = localStorage.getItem('quoridorClientId');
  if(!id){ id = Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem('quoridorClientId', id); }
  return id;
}

const params = new URLSearchParams(location.search);
let roomId = params.get('room');
const isNewRoom = !roomId;
if(isNewRoom){
  roomId = genRoomId();
  history.replaceState(null, '', location.pathname + '?room=' + roomId);
}
document.getElementById('share-link').value = location.href;
document.getElementById('btn-copy').onclick = async () => {
  const val = document.getElementById('share-link').value;
  try{ await navigator.clipboard.writeText(val); }
  catch(e){ document.getElementById('share-link').select(); return; }
  const btn = document.getElementById('btn-copy');
  const old = btn.textContent;
  btn.textContent = '✅ Kopiert';
  setTimeout(()=>{ btn.textContent = old; }, 1500);
};

const roomRef = doc(db, 'quoridorRooms', roomId);
const clientId = getClientId();

let myColor = null; /* 'a' | 'b' | 'spectator' | null */
let currentActions = [];
let state = initialState();

/* ---------- UI-Zustand: 'idle' | 'moving' | 'placing' ---------- */
let uiState = 'idle';
let wallPreview = null; /* {x,y,orient} während 'placing' */

async function bootstrapRoom(){
  if(isNewRoom){
    await setDoc(roomRef, {actions:[], a:null, b:null, createdAt: Date.now()});
  }
  let claiming = false;
  let snapSeq = 0;
  onSnapshot(roomRef, async snap => {
    const mySeq = ++snapSeq;
    if(!snap.exists()){
      document.getElementById('main-wrap').innerHTML = '<div class="card"><div class="err-box">Dieser Raum existiert nicht (mehr). Prüfe den Link oder <a href="./quoridor.html">starte einen neuen</a>.</div></div>';
      return;
    }
    const data = snap.data();
    if(myColor===null && !claiming){
      claiming = true;
      if(data.a === clientId){ myColor = 'a'; }
      else if(data.b === clientId){ myColor = 'b'; }
      else if(!data.a){ myColor = 'a'; await updateDoc(roomRef, {a: clientId}); }
      else if(!data.b){ myColor = 'b'; await updateDoc(roomRef, {b: clientId}); }
      else { myColor = 'spectator'; }
      claiming = false;
    }
    if(mySeq !== snapSeq) return;
    currentActions = data.actions || [];
    state = replay(currentActions);
    uiState = 'idle';
    wallPreview = null;
    renderRoomStatus(data);
    render();
    document.getElementById('walls-a').textContent = state.wallsLeft.a;
    document.getElementById('walls-b').textContent = state.wallsLeft.b;
    document.getElementById('btn-undo').disabled = currentActions.length===0;
  });
}

function renderRoomStatus(data){
  const el = document.getElementById('room-status');
  el.classList.remove('mine','wait');
  if(myColor==='spectator'){
    el.textContent = '👀 Zuschauer – Raum ist voll.';
    return;
  }
  const mineLabel = myColor==='a' ? 'Dunkel (Ziel unten)' : 'Hell (Ziel oben)';
  const waitingForOpponent = (myColor==='a' && !data.b) || (myColor==='b' && !data.a);
  if(waitingForOpponent){
    el.classList.add('wait');
    el.textContent = `Du: ${mineLabel} · Warte auf deinen Freund – Link teilen!`;
    return;
  }
  if(state.winner){
    const iWon = state.winner === myColor;
    el.classList.add(iWon ? 'mine' : '');
    el.textContent = iWon ? '🏆 Du hast gewonnen!' : '🏆 Dein Freund hat gewonnen.';
    return;
  }
  const myTurn = state.turn === myColor;
  if(myTurn) el.classList.add('mine');
  el.textContent = myTurn ? `🟢 Du bist dran (${mineLabel})` : `⏳ Freund ist dran (du: ${mineLabel})`;
}

bootstrapRoom();

/* ---------- Rendering ---------- */
function canInteract(){
  return (myColor==='a' || myColor==='b') && !state.winner && state.turn===myColor;
}

function render(){
  const boardEl = document.getElementById('board');
  const tracks = Array.from({length:9}, (_,i)=> i<8 ? '1fr 0.34fr' : '1fr').join(' ');
  boardEl.style.gridTemplateColumns = tracks;
  boardEl.style.gridTemplateRows = tracks;

  let html = '';
  for(let y=0;y<9;y++) for(let x=0;x<9;x++){
    const light = (x+y)%2===0;
    let cls = 'qcell ' + (light?'l':'d');
    if(y===8) cls += ' goal-a';
    if(y===0) cls += ' goal-b';
    html += `<div class="${cls}" style="grid-column:${2*x+1};grid-row:${2*y+1}"></div>`;
  }
  for(const w of state.walls){
    if(w.orient==='h'){
      html += `<div class="qwall" style="grid-column:${2*w.x+1} / span 3;grid-row:${2*w.y+2}"></div>`;
    } else {
      html += `<div class="qwall" style="grid-column:${2*w.x+2};grid-row:${2*w.y+1} / span 3"></div>`;
    }
  }
  if(uiState==='moving'){
    for(const m of legalMoves(state)){
      html += `<div class="qmove" style="grid-column:${2*m.x+1};grid-row:${2*m.y+1}"></div>`;
    }
  }
  if(uiState==='placing' && wallPreview){
    const ok = canPlaceWall(state, wallPreview.x, wallPreview.y, wallPreview.orient);
    const cls = 'qwall preview' + (ok?'':' bad');
    if(wallPreview.orient==='h'){
      html += `<div class="${cls}" style="grid-column:${2*wallPreview.x+1} / span 3;grid-row:${2*wallPreview.y+2}"></div>`;
    } else {
      html += `<div class="${cls}" style="grid-column:${2*wallPreview.x+2};grid-row:${2*wallPreview.y+1} / span 3"></div>`;
    }
  }
  const movable = uiState!=='placing' && canInteract();
  html += `<div class="qpawn a${movable && myColor==='a'?' movable':''}" style="grid-column:${2*state.pawns.a.x+1};grid-row:${2*state.pawns.a.y+1}"></div>`;
  html += `<div class="qpawn b${movable && myColor==='b'?' movable':''}" style="grid-column:${2*state.pawns.b.x+1};grid-row:${2*state.pawns.b.y+1}"></div>`;
  boardEl.innerHTML = html;

  document.getElementById('place-row').style.display = uiState==='placing' ? 'flex' : 'none';
  document.getElementById('place-hint').style.display = uiState==='placing' ? 'block' : 'none';
  document.getElementById('normal-row').style.display = uiState==='placing' ? 'none' : 'flex';
  if(uiState==='placing'){
    document.getElementById('btn-confirm').disabled = !canPlaceWall(state, wallPreview.x, wallPreview.y, wallPreview.orient);
  }
}

document.getElementById('board').addEventListener('click', e=>{
  if(!canInteract() || uiState==='placing') return;
  const rect = e.currentTarget.getBoundingClientRect();
  const colFrac = (e.clientX - rect.left) / rect.width * 9;
  const rowFrac = (e.clientY - rect.top) / rect.height * 9;
  const cellX = Math.min(8, Math.max(0, Math.floor(colFrac)));
  const cellY = Math.min(8, Math.max(0, Math.floor(rowFrac)));

  if(uiState==='moving'){
    const isLegal = legalMoves(state).some(m=>m.x===cellX && m.y===cellY);
    uiState = 'idle';
    if(isLegal){ commitAction({type:'move', x:cellX, y:cellY}); return; }
    render();
    return;
  }

  const mine = state.pawns[myColor];
  if(cellX===mine.x && cellY===mine.y){
    if(legalMoves(state).length===0) return;
    uiState = 'moving';
    render();
    return;
  }

  if(state.wallsLeft[myColor] <= 0) return; /* keine Wände mehr -> Tap ignorieren */
  const xSlot = Math.min(7, Math.max(0, Math.round(colFrac) - 1));
  const ySlot = Math.min(7, Math.max(0, Math.round(rowFrac) - 1));
  const colFracPart = colFrac - Math.floor(colFrac);
  const rowFracPart = rowFrac - Math.floor(rowFrac);
  const distCol = Math.min(colFracPart, 1-colFracPart);
  const distRow = Math.min(rowFracPart, 1-rowFracPart);
  wallPreview = { x:xSlot, y:ySlot, orient: distCol < distRow ? 'v' : 'h' };
  uiState = 'placing';
  render();
});

document.getElementById('btn-left').onclick = () => {
  wallPreview.x = Math.max(0, wallPreview.x - 1);
  render();
};
document.getElementById('btn-right').onclick = () => {
  wallPreview.x = Math.min(7, wallPreview.x + 1);
  render();
};
document.getElementById('btn-rotate').onclick = () => {
  wallPreview.orient = wallPreview.orient === 'h' ? 'v' : 'h';
  render();
};
document.getElementById('btn-confirm').onclick = () => {
  if(!canPlaceWall(state, wallPreview.x, wallPreview.y, wallPreview.orient)) return;
  const action = {type:'wall', x:wallPreview.x, y:wallPreview.y, orient:wallPreview.orient};
  uiState = 'idle';
  wallPreview = null;
  commitAction(action);
};
document.getElementById('btn-cancel').onclick = () => {
  uiState = 'idle';
  wallPreview = null;
  render();
};

async function commitAction(action){
  if(!canInteract()) return;
  const newActions = currentActions.concat([action]);
  await updateDoc(roomRef, {actions: newActions});
}

document.getElementById('btn-undo').onclick = () => {
  if(currentActions.length===0) return;
  updateDoc(roomRef, {actions: currentActions.slice(0,-1)});
};
document.getElementById('btn-new').onclick = () => {
  if(currentActions.length && !confirm('Neues Spiel starten? Der aktuelle Spielstand geht für euch beide verloren.')) return;
  updateDoc(roomRef, {actions: []});
};

render();
</script>
</body>
</html>
