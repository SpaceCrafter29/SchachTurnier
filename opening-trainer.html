<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eröffnungstrainer</title>
<style>
:root{
  --bg:#eaeaec; --panel:#ffffff; --panel2:#eeeeef; --line:#dcdcdd;
  --txt:#26262a; --muted:#7a7a80; --accent:#4a4a52;
  --ok:#2f7d4f; --bad:#a13d3d;
  --white:#f2f3f7; --black:#0b0c10;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent);font-weight:600}
header{background:var(--accent);padding:18px 14px;text-align:center}
header h1{margin:0;font-size:22px;letter-spacing:.3px;color:#fff}
header p{margin:4px 0 0;font-size:12px;color:#fff;opacity:.75}
main{padding:12px;max-width:480px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.tierhdr{font-size:11px;color:var(--muted);font-weight:700;margin:0 0 8px;text-transform:uppercase;letter-spacing:.6px}
.note{font-size:12px;color:var(--muted)}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
label:first-child{margin-top:0}
select{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:9px 10px;font-size:14px}
.side-row{display:flex;gap:8px;margin-top:10px}
.side-btn{flex:1;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:11px 6px;font-size:13px;font-weight:700;cursor:pointer}
.side-btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
button.btn{background:var(--accent);color:#fff;border:0;border-radius:9px;padding:11px 12px;font-weight:700;cursor:pointer;font-size:13px}
button.btn.sec{background:var(--panel2);color:var(--txt);border:1px solid var(--line)}
button.btn:disabled{opacity:.4;cursor:not-allowed}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btnrow .btn{flex:1}

.status{font-size:14px;font-weight:700;padding:10px 12px;border-radius:10px;background:var(--panel2);text-align:center;margin-bottom:10px;transition:background .15s,color .15s}
.status.turn{background:var(--txt);color:#fff}
.status.wait{color:var(--muted);font-weight:600}
.status.good{background:#e4f2e8;color:var(--ok)}
.status.bad{background:#f6e6e6;color:var(--bad)}

.chessboard{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);width:100%;aspect-ratio:1;border-radius:10px;overflow:hidden;border:1px solid var(--line);cursor:pointer;user-select:none}
.chessboard.locked{cursor:default}
.chessboard .sq{position:relative;display:flex;align-items:center;justify-content:center;aspect-ratio:1;min-width:0;min-height:0}
.chessboard .sq.l{background:#f0d9b5}
.chessboard .sq.d{background:#b58863}
.chessboard .sq.sel{box-shadow:inset 0 0 0 3px var(--accent)}
.chessboard .sq img{width:82%;height:82%;object-fit:contain;pointer-events:none}
.chessboard .sq .dot{position:absolute;width:28%;height:28%;border-radius:50%;background:rgba(0,0,0,.28);pointer-events:none}
.chessboard .sq .dot.cap{width:88%;height:88%;background:none;border-radius:50%;box-shadow:inset 0 0 0 4px rgba(0,0,0,.28)}

.move-list{font-size:13px;line-height:1.9;font-variant-numeric:tabular-nums;min-height:22px}
.move-list .mv-num{color:var(--muted);margin-right:2px}
.move-list .mv-san{margin-right:12px}
.move-list .mv-wrong{color:var(--bad);text-decoration:line-through;margin-right:6px}

.stat-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:13px;border-bottom:1px solid var(--line)}
.stat-row:last-child{border-bottom:0}
.stat-row .pct{font-weight:700;font-variant-numeric:tabular-nums}

footer{text-align:center;color:var(--muted);font-size:11px;padding:20px 12px 40px}
</style>
</head>
<body>

<header>
  <h1>♟️ Eröffnungstrainer</h1>
  <p>Eröffnung wählen, Seite üben, Züge aus dem Buch treffen</p>
</header>

<main>
  <div class="card" id="picker-card">
    <div class="tierhdr">Eröffnung wählen</div>
    <label for="sel-family">Eröffnung</label>
    <select id="sel-family"></select>
    <div class="side-row">
      <button class="side-btn on" id="side-w" data-side="w">Als Weiß üben</button>
      <button class="side-btn" id="side-b" data-side="b">Als Schwarz üben</button>
    </div>
    <div class="btnrow"><button class="btn" id="btn-start" style="flex:1">▶️ Training starten</button></div>
  </div>

  <div class="card" id="practice-card" style="display:none">
    <div class="status" id="status">–</div>
    <div class="chessboard" id="board"></div>
    <div class="btnrow">
      <button class="btn sec" id="btn-hint">💡 Zug zeigen</button>
      <button class="btn sec" id="btn-restart">🔁 Neu starten</button>
      <button class="btn sec" id="btn-back">↩️ Andere Eröffnung</button>
    </div>
  </div>

  <div class="card" id="moves-card" style="display:none">
    <div class="tierhdr">Züge</div>
    <div class="move-list" id="move-list">–</div>
  </div>

  <div class="card" id="stats-card" style="display:none">
    <div class="tierhdr">Fortschritt</div>
    <div id="stats-body"></div>
    <div class="btnrow"><button class="btn sec" id="btn-reset-stats" style="flex:1">Fortschritt zurücksetzen</button></div>
  </div>
</main>

<footer><a href="./index.html">← Zur Hauptseite</a></footer>

<script type="module">
"use strict";
import { Chess } from "./engine/chess.esm.js";

/* ---------- Eröffnungs-Repertoire ----------
   Kuratierte Hauptlinien der bekanntesten Eröffnungen und ihrer wichtigsten
   Varianten (nicht buchstäblich jede je gespielte Theorie-Nebenlinie —
   das wäre unrealistisch, sondern die etablierten Hauptvarianten, die man
   üblicherweise als Repertoire lernt). Jede Zugfolge wird beim Laden gegen
   die echte chess.js-Engine geprüft (siehe validateAll unten). */
const REPERTOIRE = [
  { id:'ruy-lopez', name:'Ruy Lopez (Spanisch)', lines: [
    { name:'Berliner Verteidigung', moves:['e4','e5','Nf3','Nc6','Bb5','Nf6','O-O','Nxe4','d4','Nd6','Bxc6','dxc6','dxe5','Nf5','Qxd8+','Kxd8'] },
    { name:'Geschlossenes Spanisch (Morphy)', moves:['e4','e5','Nf3','Nc6','Bb5','a6','Ba4','Nf6','O-O','Be7','Re1','b5','Bb3','d6','c3','O-O'] },
    { name:'Abtauschvariante', moves:['e4','e5','Nf3','Nc6','Bb5','a6','Bxc6','dxc6','O-O'] },
  ]},
  { id:'italian', name:'Italienisch', lines: [
    { name:'Giuoco Piano', moves:['e4','e5','Nf3','Nc6','Bc4','Bc5','c3','Nf6','d3'] },
    { name:'Zweispringerspiel', moves:['e4','e5','Nf3','Nc6','Bc4','Nf6','Ng5','d5','exd5','Na5'] },
    { name:'Evans-Gambit', moves:['e4','e5','Nf3','Nc6','Bc4','Bc5','b4','Bxb4','c3','Ba5','d4'] },
  ]},
  { id:'scotch', name:'Schottische Partie', lines: [
    { name:'Hauptvariante', moves:['e4','e5','Nf3','Nc6','d4','exd4','Nxd4','Nf6','Nc3','Bb4'] },
  ]},
  { id:'sicilian', name:'Sizilianisch', lines: [
    { name:'Najdorf-Variante', moves:['e4','c5','Nf3','d6','d4','cxd4','Nxd4','Nf6','Nc3','a6'] },
    { name:'Drachen-Variante', moves:['e4','c5','Nf3','d6','d4','cxd4','Nxd4','Nf6','Nc3','g6'] },
    { name:'Klassische Variante', moves:['e4','c5','Nf3','d6','d4','cxd4','Nxd4','Nf6','Nc3','Nc6'] },
    { name:'Sveshnikov-Variante', moves:['e4','c5','Nf3','Nc6','d4','cxd4','Nxd4','Nf6','Nc3','e5'] },
    { name:'Alapin-Variante', moves:['e4','c5','c3'] },
    { name:'Geschlossenes Sizilianisch', moves:['e4','c5','Nc3','Nc6','g3'] },
  ]},
  { id:'french', name:'Französisch', lines: [
    { name:'Vorstoßvariante', moves:['e4','e6','d4','d5','e5','c5','c3','Nc6','Nf3'] },
    { name:'Abtauschvariante', moves:['e4','e6','d4','d5','exd5','exd5'] },
    { name:'Winawer-Variante', moves:['e4','e6','d4','d5','Nc3','Bb4'] },
    { name:'Tarrasch-Variante', moves:['e4','e6','d4','d5','Nd2','Nf6','e5','Nfd7'] },
  ]},
  { id:'caro-kann', name:'Caro-Kann', lines: [
    { name:'Vorstoßvariante', moves:['e4','c6','d4','d5','e5','Bf5'] },
    { name:'Abtauschvariante', moves:['e4','c6','d4','d5','exd5','cxd5'] },
    { name:'Klassische Variante', moves:['e4','c6','d4','d5','Nc3','dxe4','Nxe4','Bf5'] },
  ]},
  { id:'scandinavian', name:'Skandinavisch', lines: [
    { name:'Hauptvariante', moves:['e4','d5','exd5','Qxd5','Nc3','Qa5','d4','Nf6','Nf3'] },
  ]},
  { id:'pirc', name:'Pirc-Verteidigung', lines: [
    { name:'Hauptvariante', moves:['e4','d6','d4','Nf6','Nc3','g6'] },
  ]},
  { id:'alekhine', name:'Aljechin-Verteidigung', lines: [
    { name:'Hauptvariante', moves:['e4','Nf6','e5','Nd5','d4','d6','Nf3'] },
  ]},
  { id:'qg', name:'Damengambit', lines: [
    { name:'Orthodoxe Verteidigung (QGD)', moves:['d4','d5','c4','e6','Nc3','Nf6','Bg5','Be7','e3','O-O'] },
    { name:'Angenommenes Damengambit (QGA)', moves:['d4','d5','c4','dxc4','Nf3','Nf6','e3'] },
    { name:'Slawisch', moves:['d4','d5','c4','c6','Nf3','Nf6','Nc3'] },
    { name:'Halbslawisch', moves:['d4','d5','c4','c6','Nf3','Nf6','Nc3','e6'] },
  ]},
  { id:'kid', name:'Königsindisch', lines: [
    { name:'Klassische Variante', moves:['d4','Nf6','c4','g6','Nc3','Bg7','e4','d6','Nf3','O-O','Be2','e5'] },
    { name:'Sämisch-Variante', moves:['d4','Nf6','c4','g6','Nc3','Bg7','e4','d6','f3'] },
  ]},
  { id:'nimzo', name:'Nimzowitsch-Indisch', lines: [
    { name:'Klassische Variante (Capablanca)', moves:['d4','Nf6','c4','e6','Nc3','Bb4','Qc2'] },
    { name:'Rubinstein-Variante', moves:['d4','Nf6','c4','e6','Nc3','Bb4','e3'] },
  ]},
  { id:'grunfeld', name:'Grünfeld-Indisch', lines: [
    { name:'Austauschvariante', moves:['d4','Nf6','c4','g6','Nc3','d5','cxd5','Nxd5','e4','Nxc3','bxc3'] },
  ]},
  { id:'qid', name:'Damenindisch', lines: [
    { name:'Hauptvariante', moves:['d4','Nf6','c4','e6','Nf3','b6','g3','Bb7','Bg2'] },
  ]},
  { id:'dutch', name:'Holländisch', lines: [
    { name:'Hauptvariante', moves:['d4','f5','g3','Nf6','Bg2','e6','Nf3'] },
  ]},
  { id:'london', name:'London-System', lines: [
    { name:'Hauptvariante', moves:['d4','d5','Nf3','Nf6','Bf4','e6','e3'] },
  ]},
  { id:'english', name:'Englisch', lines: [
    { name:'Gegen 1...e5', moves:['c4','e5','Nc3','Nf6'] },
    { name:'Symmetrisch', moves:['c4','c5','Nf3','Nf6','Nc3'] },
  ]},
  { id:'reti', name:'Réti-Eröffnung', lines: [
    { name:'Hauptvariante', moves:['Nf3','d5','c4'] },
  ]},
];

/* ---------- Baum aus den Linien zusammenführen ---------- */
function buildFamilyTree(family){
  const root = { move:null, fen:new Chess().fen(), children:{}, labels:[] };
  for(const line of family.lines){
    const chess = new Chess();
    let node = root;
    for(const san of line.moves){
      const res = chess.move(san);
      if(!res) throw new Error(`Ungültiger Zug "${san}" in "${family.name} – ${line.name}"`);
      if(!node.children[res.san]) node.children[res.san] = { move:res.san, fen:chess.fen(), children:{}, labels:[] };
      node = node.children[res.san];
    }
    node.labels.push(line.name);
  }
  return root;
}
/* Beim Laden einmal alle Familien bauen -> validiert gleichzeitig jede Linie */
const TREES = {};
for(const family of REPERTOIRE) TREES[family.id] = buildFamilyTree(family);

/* ---------- Fortschritt (localStorage) ---------- */
const STATS_KEY = 'openingTrainerStats';
function loadStats(){ try{ return JSON.parse(localStorage.getItem(STATS_KEY)) || {}; }catch(e){ return {}; } }
function saveStats(s){ localStorage.setItem(STATS_KEY, JSON.stringify(s)); }
function recordResult(familyId, correct){
  const s = loadStats();
  s[familyId] = s[familyId] || {attempts:0, correct:0};
  s[familyId].attempts++;
  if(correct) s[familyId].correct++;
  saveStats(s);
  renderStats();
}
function renderStats(){
  const stats = loadStats();
  const ids = Object.keys(stats);
  const card = document.getElementById('stats-card');
  if(ids.length===0){ card.style.display='none'; return; }
  card.style.display='block';
  const nameOf = id => (REPERTOIRE.find(f=>f.id===id)||{}).name || id;
  document.getElementById('stats-body').innerHTML = ids.map(id=>{
    const s = stats[id];
    const pct = s.attempts ? Math.round(100*s.correct/s.attempts) : 0;
    return `<div class="stat-row"><span>${esc(nameOf(id))}</span><span class="pct">${s.correct}/${s.attempts} (${pct}%)</span></div>`;
  }).join('');
}
document.getElementById('btn-reset-stats').onclick = () => {
  if(!confirm('Fortschritt wirklich zurücksetzen?')) return;
  localStorage.removeItem(STATS_KEY);
  renderStats();
};
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---------- Auswahl-UI ---------- */
const selFamily = document.getElementById('sel-family');
selFamily.innerHTML = REPERTOIRE.map(f=>`<option value="${f.id}">${esc(f.name)}</option>`).join('');
let mySide = 'w';
document.getElementById('side-w').onclick = () => setSide('w');
document.getElementById('side-b').onclick = () => setSide('b');
function setSide(s){
  mySide = s;
  document.getElementById('side-w').classList.toggle('on', s==='w');
  document.getElementById('side-b').classList.toggle('on', s==='b');
}
document.getElementById('btn-start').onclick = () => startPractice();
document.getElementById('btn-back').onclick = () => {
  document.getElementById('picker-card').style.display = 'block';
  document.getElementById('practice-card').style.display = 'none';
  document.getElementById('moves-card').style.display = 'none';
};
document.getElementById('btn-restart').onclick = () => startPractice();

/* ---------- Übungs-Zustand ---------- */
let chess, tree, node, familyId, selected, history;

function startPractice(){
  familyId = selFamily.value;
  tree = TREES[familyId];
  node = tree;
  chess = new Chess();
  selected = null;
  history = [];
  document.getElementById('picker-card').style.display = 'none';
  document.getElementById('practice-card').style.display = 'block';
  document.getElementById('moves-card').style.display = 'block';
  renderAll();
  step();
}

/* Wenn der Gegner am Zug ist, automatisch eine (zufällige) bekannte
   Fortsetzung aus dem Baum spielen; ist man selbst dran, wartet die
   Funktion einfach auf einen Brettklick. */
function step(){
  const children = Object.keys(node.children);
  if(children.length===0){
    const labels = node.labels.length ? node.labels.join(', ') : 'Ende der Linie';
    setStatus(`🎉 Geschafft: ${labels}`, 'good');
    recordResult(familyId, true);
    renderAll();
    return;
  }
  if(chess.turn() !== mySide){
    setStatus('Gegner zieht…', 'wait');
    renderAll();
    setTimeout(()=>{
      const san = children[Math.floor(Math.random()*children.length)];
      chess.move(san);
      node = node.children[san];
      history.push({san, wrong:false});
      renderMoveList();
      step();
    }, 550);
    return;
  }
  setStatus('🟢 Du bist dran', 'turn');
  renderAll();
}

function setStatus(text, cls){
  const el = document.getElementById('status');
  el.className = 'status' + (cls ? ' '+cls : '');
  el.textContent = text;
}

function attemptMove(from, to, promotion){
  const test = new Chess(chess.fen());
  const res = test.move(promotion ? {from,to,promotion} : {from,to});
  if(!res) return;
  if(node.children[res.san]){
    chess.move(promotion ? {from,to,promotion} : {from,to});
    node = node.children[res.san];
    history.push({san:res.san, wrong:false});
    selected = null;
    renderMoveList();
    step();
  } else {
    const correct = Object.keys(node.children);
    setStatus(`❌ Nicht die Buchvariante. Richtig wäre: ${correct.join(' oder ')}`, 'bad');
    recordResult(familyId, false);
    selected = null;
    renderBoard();
  }
}

document.getElementById('btn-hint').onclick = () => {
  const correct = Object.keys(node.children);
  if(correct.length===0) return;
  setStatus(`💡 ${correct.join(' oder ')}`, 'wait');
};

/* ---------- Board rendering (gleiches Muster wie bei den anderen Tools) ---------- */
function pieceFile(p){ return (p.color==='w' ? p.type.toUpperCase() : p.type) + (p.color==='w' ? '-white' : '-black'); }

function canInteract(){ return chess.turn()===mySide && Object.keys(node.children).length>0; }

function renderBoard(){
  const boardEl = document.getElementById('board');
  boardEl.classList.toggle('locked', !canInteract());
  let legalTargets = [];
  if(selected) legalTargets = chess.moves({square:selected, verbose:true}).map(m=>m.to);
  let html = '';
  for(let r=0;r<8;r++){
    for(let f=0;f<8;f++){
      const sq = 'abcdefgh'[f] + (8-r);
      const piece = chess.get(sq);
      let inner = piece ? `<img src="./pieces/${pieceFile(piece)}.svg" alt="" draggable="false">` : '';
      if(legalTargets.includes(sq)) inner += `<div class="dot${piece?' cap':''}"></div>`;
      const cls = ['sq', (r+f)%2===0?'l':'d'];
      if(sq===selected) cls.push('sel');
      html += `<div class="${cls.join(' ')}" data-square="${sq}">${inner}</div>`;
    }
  }
  boardEl.innerHTML = html;
}
document.getElementById('board').addEventListener('click', e=>{
  if(!canInteract()) return;
  const sqEl = e.target.closest('.sq');
  if(!sqEl) return;
  const sq = sqEl.dataset.square;
  const piece = chess.get(sq);
  if(selected){
    if(sq===selected){ selected=null; renderBoard(); return; }
    const legal = chess.moves({square:selected, verbose:true}).filter(m=>m.to===sq);
    if(legal.length){
      attemptMove(selected, sq, legal[0].promotion ? 'q' : undefined);
      return;
    }
    if(piece && piece.color===chess.turn()){ selected=sq; renderBoard(); return; }
    selected=null; renderBoard(); return;
  }
  if(piece && piece.color===chess.turn()){ selected=sq; renderBoard(); }
});

function renderMoveList(){
  const el = document.getElementById('move-list');
  if(!history.length){ el.textContent = '–'; return; }
  let html = '';
  for(let i=0;i<history.length;i+=2){
    const num = i/2+1;
    html += `<span class="mv-num">${num}.</span><span class="mv-san">${esc(history[i].san)}</span>`;
    if(history[i+1]) html += `<span class="mv-san">${esc(history[i+1].san)}</span>`;
  }
  el.innerHTML = html;
}

function renderAll(){ renderBoard(); renderMoveList(); }

renderStats();
</script>
</body>
</html>
